<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document Intelligence Platform</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

    <header>
        <h1>Document Intelligence Platform</h1>
        <p>Financial Document Extraction & Validation</p>
    </header>


    <main>

        <section class="upload-section">

            <h2>Process Document</h2>

            <form id="uploadForm">

                <label for="documentType">
                    Document Type
                </label>

                <select
                    id="documentType"
                    name="document_type"
                    required
                >
                    <option value="">
                        Select document type
                    </option>

                    <option value="invoice">
                        Invoice
                    </option>

                    <option value="balance_sheet">
                        Balance Sheet
                    </option>

                    <option value="profit_and_loss">
                        Profit & Loss
                    </option>

                    <option value="cash_flow_statement">
                        Cash Flow Statement
                    </option>
                </select>


                <label for="file">
                    Document
                </label>

                <input
                    type="file"
                    id="file"
                    name="file"
                    accept=".pdf,.jpg,.jpeg,.png"
                    required
                >


                <button type="submit">
                    Process Document
                </button>

            </form>


            <div id="message"></div>

        </section>


        <section class="documents-section">

            <h2>Processed Documents</h2>

            <table>

                <thead>
                    <tr>
                        <th>Document Name</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Processed At</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="documentsTableBody">
                </tbody>

            </table>

        </section>

    </main>


    <script src="/static/js/dashboard.js"></script>

</body>

</html>
